<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Apply the saved theme before the page paints. Light is the default.
      try {
        if (localStorage.getItem("lenslayer-landing-theme") === "dark") {
          document.documentElement.dataset.theme = "dark"
          document.querySelector('meta[name="theme-color"]').content = "#191a17"
        }
      } catch { /* Storage may be unavailable in private browsing. */ }
    </script>
    <meta
      name="description"
      content="Agentic document intelligence for teams. Surface risks and obligations, ask source-linked questions, review decisions together, and prepare agent-assisted follow-up tasks."
    />
    <link rel="preload" href="/src/assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/instrument-serif-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Match the picture's preferred source and shell width, without downloading a second format. -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high"
      imagesrcset="/hero/dashboard-v1-480.avif 480w, /hero/dashboard-v1-768.avif 768w, /hero/dashboard-v1-1152.avif 1152w, /hero/dashboard-v1-1728.avif 1728w"
      imagesizes="(max-width: 560px) calc(100vw - 40px), min(91vw, 1240px)" />
    <title>LensLayer | Agentic document intelligence for teams</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
