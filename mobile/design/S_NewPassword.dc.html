  <h1 class="lt">Set a new password</h1>
  <p class="sub">For ada@harborfinch.example</p>

    <label class="field"><span class="lbl">New password</span><span class="inp">••••••••••••<span style="flex: 1"></span><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span></label>

      <span class="rule" style="color: var(--good)"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Not a commonly breached password</span>
      <span class="rule" style="color: var(--good)"><svg class="i xs" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Different from your last password</span>
