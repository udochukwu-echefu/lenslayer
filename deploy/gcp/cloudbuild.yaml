# Existing-production rollout only. No provisioning, IAM grants, queue/recovery
# activation or traffic promotion. All runtime flags come from the pure renderer.
# Core authority/storage/secret pins live in production-release.json, not overrides.
substitutions:
  _SOURCE_COMMIT: REVIEW_REQUIRED
  _PROVIDER_SNAPSHOT_FILE: REVIEW_REQUIRED
  _PROVIDER_PROFILE_FILE: NONE
  _MIGRATION_APPROVAL: REVIEW_REQUIRED
  _AGENT_WORKER_ORIGIN: REVIEW_REQUIRED
  _DASHBOARD_URL: https://app.lenslayer.online

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: validate-reviewed-provider-state
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - -m
      - scripts.production_provider_release
      - --project=$PROJECT_ID
      - --dashboard-origin=${_DASHBOARD_URL}
      - --source-commit=${_SOURCE_COMMIT}
      - --build-source-commit=$COMMIT_SHA
      - --worker-origin=${_AGENT_WORKER_ORIGIN}
      - --provider-snapshot=${_PROVIDER_SNAPSHOT_FILE}
      - --provider-profile=${_PROVIDER_PROFILE_FILE}
      - --output=/workspace/output/provider-release

  - id: pull-runtime-cache
    name: gcr.io/cloud-builders/docker
    args: [pull, 'europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:cache']
    allowFailure: true

  - id: build-runtime
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - backend/Dockerfile
      - --cache-from
      - europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:cache
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:$BUILD_ID
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:cache
      - .

  - id: push-runtime
    name: gcr.io/cloud-builders/docker
    args: [push, 'europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:$BUILD_ID']

  - id: push-runtime-cache
    name: gcr.io/cloud-builders/docker
    args: [push, 'europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:cache']

  - id: resolve-immutable-runtime
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -ec
      - >-
        gcloud artifacts docker images describe
        europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:$BUILD_ID
        --project=$PROJECT_ID --format='value(image_summary.digest)'
        > /workspace/production-image-digest.txt

  - id: configure-migration-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - -m
      - scripts.production_provider_release
      - --project=$PROJECT_ID
      - --dashboard-origin=${_DASHBOARD_URL}
      - --source-commit=${_SOURCE_COMMIT}
      - --build-source-commit=$COMMIT_SHA
      - --worker-origin=${_AGENT_WORKER_ORIGIN}
      - --provider-snapshot=${_PROVIDER_SNAPSHOT_FILE}
      - --provider-profile=${_PROVIDER_PROFILE_FILE}
      - --output=/workspace/output/provider-release
      - --image-digest-file=/workspace/production-image-digest.txt
      - --migration-approval=${_MIGRATION_APPROVAL}
      - --command-id=configure-migration

  - id: migrate-neon
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - -m
      - scripts.production_provider_release
      - --project=$PROJECT_ID
      - --dashboard-origin=${_DASHBOARD_URL}
      - --source-commit=${_SOURCE_COMMIT}
      - --build-source-commit=$COMMIT_SHA
      - --worker-origin=${_AGENT_WORKER_ORIGIN}
      - --provider-snapshot=${_PROVIDER_SNAPSHOT_FILE}
      - --provider-profile=${_PROVIDER_PROFILE_FILE}
      - --output=/workspace/output/provider-release
      - --image-digest-file=/workspace/production-image-digest.txt
      - --migration-approval=${_MIGRATION_APPROVAL}
      - --command-id=migrate-with-recovery-point

  - id: deploy-on-demand-agent-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - -m
      - scripts.production_provider_release
      - --project=$PROJECT_ID
      - --dashboard-origin=${_DASHBOARD_URL}
      - --source-commit=${_SOURCE_COMMIT}
      - --build-source-commit=$COMMIT_SHA
      - --worker-origin=${_AGENT_WORKER_ORIGIN}
      - --provider-snapshot=${_PROVIDER_SNAPSHOT_FILE}
      - --provider-profile=${_PROVIDER_PROFILE_FILE}
      - --output=/workspace/output/provider-release
      - --image-digest-file=/workspace/production-image-digest.txt
      - --command-id=deploy-sleeping-worker

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - -m
      - scripts.production_provider_release
      - --project=$PROJECT_ID
      - --dashboard-origin=${_DASHBOARD_URL}
      - --source-commit=${_SOURCE_COMMIT}
      - --build-source-commit=$COMMIT_SHA
      - --worker-origin=${_AGENT_WORKER_ORIGIN}
      - --provider-snapshot=${_PROVIDER_SNAPSHOT_FILE}
      - --provider-profile=${_PROVIDER_PROFILE_FILE}
      - --output=/workspace/output/provider-release
      - --image-digest-file=/workspace/production-image-digest.txt
      - --command-id=deploy-api-without-traffic

  - id: deploy-review-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args:
      - -m
      - scripts.production_provider_release
      - --project=$PROJECT_ID
      - --dashboard-origin=${_DASHBOARD_URL}
      - --source-commit=${_SOURCE_COMMIT}
      - --build-source-commit=$COMMIT_SHA
      - --worker-origin=${_AGENT_WORKER_ORIGIN}
      - --provider-snapshot=${_PROVIDER_SNAPSHOT_FILE}
      - --provider-profile=${_PROVIDER_PROFILE_FILE}
      - --output=/workspace/output/provider-release
      - --image-digest-file=/workspace/production-image-digest.txt
      - --command-id=deploy-bounded-review-job

images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:$BUILD_ID
  - europe-west1-docker.pkg.dev/$PROJECT_ID/lenslayer/platform:cache
