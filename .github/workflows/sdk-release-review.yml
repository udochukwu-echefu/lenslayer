name: SDK release artifact review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install locked dependencies
        run: npm --prefix sdk ci
      - name: Check packed artifact, install, exports and types
        run: npm --prefix sdk run release:check
      - name: Pack exact review artifact and record integrity
        working-directory: sdk
        run: |
          mkdir -p ../sdk-release-review
          npm pack --json --pack-destination ../sdk-release-review > ../sdk-release-review/pack.json
          cd ../sdk-release-review
          sha256sum *.tgz > SHA256SUMS
      - name: Save review artifact; this job never publishes
        uses: actions/upload-artifact@v4
        with:
          name: lenslayer-agent-sdk-${{ github.sha }}
          path: sdk-release-review/
          if-no-files-found: error
          retention-days: 7
