name: Lenslayer tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lenslayer_test
          POSTGRES_DB: lenslayer_agent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U lenslayer_test -d lenslayer_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            landing/package-lock.json
            sdk/package-lock.json
            mcp/package-lock.json
            hosted-agent/package-lock.json

      - name: Use lockfile-compatible npm
        run: npm install --global npm@11.12.1

      - name: Install system packages
        run: |
          sudo apt-get update
          xargs -a packages.txt sudo apt-get install -y

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q evaluation.py backend tests

      - name: Run Python tests
        env:
          PYTHONPATH: .
          LENSLAYER_TEST_POSTGRES_ACK: create_disposable_schema
          LENSLAYER_TEST_POSTGRES_URL: postgresql+psycopg://lenslayer_test@127.0.0.1:5432/lenslayer_agent_test
        run: python -m unittest discover -s tests -v

      - name: Verify database migrations
        env:
          LENSLAYER_PLATFORM_DATABASE_URL: sqlite:////tmp/lenslayer-platform-ci.db
        run: alembic -c backend/alembic.ini upgrade head

      - name: Run report quality gate
        run: python -m evaluation evaluation_fixtures

      - name: Install agent client dependencies
        run: |
          npm --prefix sdk ci
          npm --prefix mcp ci
          npm --prefix hosted-agent ci

      - name: Verify SDK artifact, MCP wire protocol, planner and external example
        run: make check-agents PYTHON=python

      - name: Verify disposable API and worker integrations
        run: make check-agent-integration PYTHON=python

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Test dashboard
        working-directory: dashboard
        run: npm test

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Install landing dependencies
        working-directory: landing
        run: npm ci

      - name: Lint landing
        working-directory: landing
        run: npm run check

      - name: Build landing
        working-directory: landing
        env:
          VITE_APP_URL: https://lenslayer-dashboard.udboy361.workers.dev
        run: npm run build

      - name: Reject local URLs in landing artifact
        run: |
          if grep -R "http://localhost" landing/dist; then
            echo "The landing production artifact contains a localhost URL."
            exit 1
          fi
